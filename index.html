
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Dost Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4b0082,#8a2be2);
}

.login-box{
    width:90%;
    max-width:380px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    padding:30px;
    border-radius:20px;
    color:white;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.login-box h1{
    font-size:34px;
    margin-bottom:10px;
}

.login-box p{
    color:#ddd;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:16px;
}

input::placeholder{
    color:#ddd;
}

button{
    width:100%;
    padding:14px;
    margin-top:30px;
    border:none;
    border-radius:10px;
    background:white;
    color:#6a0dad;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#eee;
}

.bottom-text{
    text-align:center;
    margin-top:20px;
    color:#ddd;
    font-size:14px;
}

.bottom-text a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="login-box">

<h1>Welcome Back</h1>

<p>Log in to Cyber Dost Portal</p>

<label>Email</label>
<input type="email" placeholder="john@example.com">

<label>Password</label>
<input type="password" placeholder="********">

<button>Login</button>

<div class="bottom-text">
Don’t have an account?
<a href="#">Register here</a>
</div>

</div>

</body>
</html>
