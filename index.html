<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Dost</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2b1055,#7597de);
}

.login-box{
    width:90%;
    max-width:380px;
    padding:30px;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(12px);
    color:white;
    box-shadow:0 0 25px rgba(0,0,0,0.3);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:38px;
    color:#ffffff;
}

.logo p{
    color:#dddddd;
    margin-top:5px;
}

h2{
    margin-bottom:10px;
    font-size:32px;
}

.subtitle{
    color:#dddddd;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    color:white;
    font-size:16px;
}

input::placeholder{
    color:#dddddd;
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    border:none;
    border-radius:12px;
    background:white;
    color:#5b21b6;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#eeeeee;
}

.bottom{
    text-align:center;
    margin-top:20px;
    color:#dddddd;
}

.bottom a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="login-box">

<div class="logo">
<h1>CYBER DOST</h1>
<p>Track • Report • Resolve</p>
</div>

<h2>Welcome Back</h2>

<p class="subtitle">
Log in to track your complaints.
</p>

<label>Email</label>
<input type="email" placeholder="john@example.com">

<label>Password</label>
<input type="password" placeholder="********">

<button>Login</button>

<div class="bottom">
Don’t have an account?
<a href="#">Register here</a>
</div>

</div>

</body>
</html>
