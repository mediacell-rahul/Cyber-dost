<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }body {
  background: linear-gradient(135deg, #ff4d6d, #ff99ac);
  overflow: hidden;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

.active {
  display: flex;
}

h1 {
  font-size: 4rem;
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from {
    text-shadow: 0 0 10px white;
  }
  to {
    text-shadow: 0 0 30px #ffeb3b;
  }
}

button {
  margin-top: 30px;
  padding: 15px 35px;
  border: none;
  border-radius: 40px;
  background: white;
  color: #ff4d6d;
  font-size: 1.2rem;
  cursor: pointer;
  transition: 0.3s;
  font-weight: bold;
}

button:hover {
  transform: scale(1.1);
}

/* HEART BALLOONS */
.heart {
  position: absolute;
  bottom: -50px;
  color: red;
  font-size: 30px;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(-120vh) scale(1.5);
    opacity: 0;
  }
}

/* DANCING BOY GIRL */
.dance-container {
  display: flex;
  gap: 60px;
  align-items: flex-end;
  margin-top: 30px;
}

.person {
  font-size: 120px;
  animation: dance 1s infinite alternate;
}

.girl {
  animation-delay: 0.5s;
}

@keyframes dance {
  from {
    transform: translateY(0) rotate(-5deg);
  }
  to {
    transform: translateY(-25px) rotate(5deg);
  }
}

.music {
  margin-top: 20px;
  font-size: 1.5rem;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

  </style>
</head>
<body>  <!-- SCREEN 1 -->  <div class="screen active" id="screen1">
    <h1>I ❤️ U</h1>
    <button onclick="nextScreen(2)">Next Step</button>
  </div>  <!-- SCREEN 2 -->  <div class="screen" id="screen2">
    <h1>Love is Flying ❤️🎈</h1>
    <button onclick="nextScreen(3)">Next Step</button>
  </div>  <!-- SCREEN 3 -->  <div class="screen" id="screen3">
    <h1>Couple Dance 💃🕺</h1><div class="dance-container">
  <div class="person boy">🕺</div>
  <div class="person girl">💃</div>
</div>

<div class="music">🎵 Romantic Dance 🎵</div>

  </div>  <script>
    function nextScreen(screenNumber) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });

      document.getElementById('screen' + screenNumber).classList.add('active');

      if (screenNumber === 2) {
        createHearts();
      }
    }

    function createHearts() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '❤️';

        heart.style.left = Math.random() * window.innerWidth + 'px';
        heart.style.fontSize = (20 + Math.random() * 40) + 'px';

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 6000);
      }, 300);
    }
  </script></body>
</html>
